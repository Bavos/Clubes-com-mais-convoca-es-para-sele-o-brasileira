name: Render Ranking Video

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: out/video.mp4
